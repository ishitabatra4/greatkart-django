<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Password Reset</title>

</head>

<body>

    <h2>Password Reset</h2>

    <p>
        Hello {{ user.first_name }},
    </p>

    <p>
        As requested, please use the following link to reset your password.
    </p>

    <p>

        <a
            href="{{ reset_url }}"
            style="
                display:inline-block;
                padding:12px 20px;
                background-color:#007bff;
                color:white;
                text-decoration:none;
                border-radius:5px;
            "
        >
            Reset Password
        </a>

    </p>

    <p>
        If you did not request a password reset, you can ignore this email.
    </p>

</body>

</html>
