{% extends 'base.html' %}

{% load static %}

{% block content %}

<!-- ========================= SECTION CONTENT ========================= -->

<section class="section-conten padding-y" style="min-height:84vh">

<!-- ============================ COMPONENT LOGIN   ================================= -->

<div class="card mx-auto" style="max-width: 600px; margin-top:100px;">

    <div class="card-body">

        <h4 class="card-title mb-4">Forgot Password</h4>

        {% include 'includes/alerts.html' %}

        <form id="forgot-password-form">

            <div class="form-group">

                <input
                    type="email"
                    class="form-control"
                    placeholder="Email Address"
                    name="email"
                    id="email"
                    required
                >

            </div>

            <div class="form-group">

                <a href="{% url 'login' %}" class="float-right">
                    Got password? Login
                </a>

            </div>

            <div class="form-group">

                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                >
                    Submit
                </button>

            </div>
            <div id="message" class="text-center mt-3"></div>

        </form>



    </div>

</div>

<p class="text-center mt-4">
    Don't have account?
    <a href="{% url 'register' %}">Sign up</a>
</p>

<br><br>

<!-- ============================ COMPONENT LOGIN  END.// ================================= -->

</section>

<!-- ========================= SECTION CONTENT END// ========================= -->



<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('forgot-password-form');
    const emailInput = document.getElementById('email');
    const message = document.getElementById('message');
    const button = form?.querySelector('[type="submit"]');

    if (!form || !emailInput || !message) {
        console.error('Forgot password form elements are missing.');
        return;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
            message.textContent = 'Please enter your email address.';
            message.className = 'text-center mt-3 text-danger';
            return;
        }

        if (!window.API) {
            message.textContent = 'API helper not loaded. Please refresh the page.';
            message.className = 'text-center mt-3 text-danger';
            console.error('window.API is unavailable.');
            return;
        }

        if (button) {
            button.disabled = true;
            button.textContent = 'Sending...';
        }

        message.textContent = 'Sending reset instructions...';
        message.className = 'text-center mt-3';

        try {
            const response = await window.API.request(
                '/accounts/api/forgot-password/',
                {
                    method: 'POST',
                    body: JSON.stringify({ email: email })
                }
            );

            const data = await response.json().catch(() => ({}));

            console.log('Forgot password response:', response.status, data);

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    data.detail ||
                    'Unable to send the reset email.'
                );
            }

            message.textContent =
                data.message || 'Password reset email has been sent.';
            message.className = 'text-center mt-3 text-success';
            message.style.display = 'block';

        } catch (error) {
            console.error('Forgot password error:', error);

            message.textContent =
                error.message || 'Something went wrong. Please try again.';
            message.className = 'text-center mt-3 text-danger';
            message.style.display = 'block';

        } finally {
            if (button) {
                button.disabled = false;
                button.textContent = 'Submit';
            }
        }
    });
});
</script>


{% endblock %}
