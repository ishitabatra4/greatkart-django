{% extends 'base.html' %}

{% load static %}

{% block content %}

<!-- ========================= SECTION CONTENT ========================= -->

<section class="section-conten padding-y" style="min-height:84vh">

<!-- ============================ COMPONENT LOGIN   ================================= -->

<div class="card mx-auto" style="max-width: 600px; margin-top:100px;">

    <div class="card-body">

        <h4 class="card-title mb-4">Forgot Password</h4>

        {% include 'includes/alerts.html' %}

        <form id="forgot-password-form">

            <div class="form-group">

                <input
                    type="email"
                    class="form-control"
                    placeholder="Email Address"
                    name="email"
                    id="email"
                    required
                >

            </div>

            <div class="form-group">

                <a href="{% url 'login' %}" class="float-right">
                    Got password? Login
                </a>

            </div>

            <div class="form-group">

                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                >
                    Submit
                </button>

            </div>

        </form>

        <div id="message" class="text-center mt-3"></div>

    </div>

</div>

<p class="text-center mt-4">
    Don't have account?
    <a href="{% url 'register' %}">Sign up</a>
</p>

<br><br>

<!-- ============================ COMPONENT LOGIN  END.// ================================= -->

</section>

<!-- ========================= SECTION CONTENT END// ========================= -->

<script>

document.getElementById('forgot-password-form').addEventListener(
    'submit',
    async function(e) {

        e.preventDefault();

        const email=document.getElementById('email').value;

        const message=document.getElementById('message');

        message.innerText='Sending...';

        try {

            const response=await fetch(
                '/accounts/api/forgot-password/',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify({
                        email:email
                    })
                }
            );

            const data=await response.json();

            message.innerText=data.message || data.detail;

        } catch(error) {

            message.innerText='Something went wrong. Please try again.';

        }

    }
);

</script>

{% endblock %}
