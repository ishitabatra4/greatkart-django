{% extends 'base.html' %}

{% block content %}

<section class="section-content padding-y">
<div class="container">

<div class="card mx-auto" style="max-width:650px;margin-top:40px;">

<div class="card-body">

<h4 class="card-title mb-4">
Become a Vendor
</h4>

<p class="text-muted">
Use your existing customer account to start selling products.
</p>

<form method="POST">

{% csrf_token %}

<div class="form-group">

<label>Store Name</label>

<input type="text"
       name="store_name"
       class="form-control"
       placeholder="Enter your store name"
       required>

</div>


<div class="form-group">

<label>Store Description</label>

<textarea name="store_description"
          class="form-control"
          rows="4"
          placeholder="Tell customers about your store"></textarea>

</div>


<div class="alert alert-info">

Your vendor account will require admin approval before you can start selling.

</div>


<button type="submit"
        class="btn btn-primary btn-block">

Apply as Vendor

</button>


<a href="{% url 'dashboard' %}"
   class="btn btn-light btn-block">

Cancel

</a>

</form>

</div>
</div>

</div>
</section>

{% endblock %}
