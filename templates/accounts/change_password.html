{% extends 'base.html' %}

{% block content %}

<section class="section-conten padding-y bg">

{% include 'includes/alerts.html' %}

<div class="container">
    <div class="row">
        {% include 'includes/dashboard_sidebar.html' %}

        <main class="col-md-9">
            <article class="card">
                <header class="card-header">
                    <strong class="d-inline-block mr-3">Change Your Password</strong>
                </header>

                <div class="card-body">
                    <div class="row">
                        <div class="col-md-12">

                            <div id="password-message" class="alert" role="alert" hidden></div>

                            <form id="change-password-form">

                                <div class="form-group">
                                    <label>Current Password</label>
                                    <input
                                        type="password"
                                        name="current_password"
                                        placeholder="Current Password"
                                        class="form-control"
                                        autocomplete="current-password"
                                        required
                                    >
                                </div>

                                <div class="form-group">
                                    <label>Create new password</label>
                                    <input
                                        type="password"
                                        name="new_password"
                                        placeholder="Create New Password"
                                        class="form-control"
                                        autocomplete="new-password"
                                        required
                                    >
                                </div>

                                <div class="form-group">
                                    <label>Confirm new password</label>
                                    <input
                                        type="password"
                                        name="confirm_password"
                                        placeholder="Confirm New Password"
                                        class="form-control"
                                        autocomplete="new-password"
                                        required
                                    >
                                </div>

                                <button type="submit" id="password-submit" class="btn btn-primary">
                                    Submit
                                </button>

                            </form>
                        </div>
                    </div>
                </div>
            </article>
        </main>
    </div>
</div>

</section>

<script>
document.addEventListener('DOMContentLoaded', async function () {
    const form = document.getElementById('change-password-form');
    const messageBox = document.getElementById('password-message');
    const submitButton = document.getElementById('password-submit');

    function showMessage(message, success = false) {
        messageBox.textContent = message;
        messageBox.className = 'alert ' + (
            success ? 'alert-success' : 'alert-danger'
        );
        messageBox.hidden = false;
    }

    // Wait for the JWT authentication setup to finish.
    if (window.API && window.API.ready) {
        await window.API.ready;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        messageBox.hidden = true;
        submitButton.disabled = true;

        const formData = new FormData(form);

        const payload = {
            current_password: formData.get('current_password'),
            new_password: formData.get('new_password'),
            confirm_password: formData.get('confirm_password')
        };

        try {
            const response = await window.API.fetch(
                '/accounts/api/change-password/',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                }
            );

            const data = await response.json();

            if (!response.ok) {
                const errorMessage = Array.isArray(data.message)
                    ? data.message.join(' ')
                    : (data.message || data.detail || 'Unable to change password.');

                showMessage(errorMessage);
                return;
            }

            showMessage(
                data.message || 'Password updated successfully.',
                true
            );

            form.reset();

        } catch (error) {
            console.error('Change password error:', error);
            showMessage('Something went wrong. Please try again.');
        } finally {
            submitButton.disabled = false;
        }
    });
});
</script>

{% endblock %}
