{% extends 'base.html' %}

{% load static %}

{% block content %}

<!-- ========================= SECTION CONTENT ========================= -->

<section class="section-conten padding-y" style="min-height:84vh">

<!-- ============================ COMPONENT LOGIN   ================================= -->

<div class="card mx-auto" style="max-width:380px; margin-top:100px;">

    <div class="card-body">

        <h4 class="card-title mb-4">Reset Password</h4>

        {% include 'includes/alerts.html' %}

        <form id="reset-password-form">

            <div class="form-group">

                <input
                    type="password"
                    class="form-control"
                    placeholder="Create Password"
                    name="password"
                    id="password"
                    required
                >

            </div>

            <div class="form-group">

                <input
                    type="password"
                    class="form-control"
                    placeholder="Confirm Password"
                    name="confirm_password"
                    id="confirm_password"
                    required
                >

            </div>

            <div class="form-group">

                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                >
                    Reset
                </button>

            </div>

        </form>

        <div id="message" class="text-center mt-3"></div>

    </div>

</div>

<p class="text-center mt-4">
    Don't have account?
    <a href="{% url 'register' %}">Sign up</a>
</p>

<br><br>

<!-- ============================ COMPONENT LOGIN  END.// ================================= -->

</section>

<!-- ========================= SECTION CONTENT END// ========================= -->

<script>

document.getElementById('reset-password-form').addEventListener(
    'submit',
    async function(e) {

        e.preventDefault();

        const password=document.getElementById('password').value;

        const confirm_password=document.getElementById(
            'confirm_password'
        ).value;

        const message=document.getElementById('message');

        if(password!==confirm_password) {

            message.innerText='Passwords do not match.';

            return;
        }

        const params=new URLSearchParams(
            window.location.search
        );

        const uid=params.get('uid');

        const token=params.get('token');

        if(!uid || !token) {

            message.innerText=
                'Invalid or expired reset link.';

            return;
        }

        message.innerText='Resetting password...';

        try {

            const response=await fetch(
                '/accounts/api/reset-password/',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify({
                        uid:uid,
                        token:token,
                        password:password,
                        confirm_password:confirm_password
                    })
                }
            );

            const data=await response.json();

            console.log('Reset API response:',data);

            if(response.ok) {

                message.innerText=
                    data.message ||
                    'Password reset successful.';

                setTimeout(function() {

                    window.location.href=
                        "{% url 'login' %}";

                },2000);

}
else {

    message.innerText=
        JSON.stringify(data);

    console.log('Reset failed:',data);

}

        }
        catch(error) {

            console.error(error);

            message.innerText=
                'Something went wrong. Please try again.';

        }

    }
);

</script>

{% endblock %}
