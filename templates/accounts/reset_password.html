{% extends 'base.html' %}

{% load static %}

{% block content %}

<!-- ========================= SECTION CONTENT ========================= -->

<section class="section-conten padding-y" style="min-height:84vh">

<!-- ============================ COMPONENT LOGIN   ================================= -->

<div class="card mx-auto" style="max-width:380px; margin-top:100px;">

    <div class="card-body">

        <h4 class="card-title mb-4">Reset Password</h4>

        {% include 'includes/alerts.html' %}

        <form id="reset-password-form">

            <div class="form-group">

                <input
                    type="password"
                    class="form-control"
                    placeholder="Create Password"
                    name="password"
                    id="password"
                    required
                >

            </div>

            <div class="form-group">

                <input
                    type="password"
                    class="form-control"
                    placeholder="Confirm Password"
                    name="confirm_password"
                    id="confirm_password"
                    required
                >

            </div>

            <div class="form-group">

                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                >
                    Reset
                </button>

            </div>
            <div id="message" class="text-center mt-3"></div>

        </form>

        

    </div>

</div>

<p class="text-center mt-4">
    Don't have account?
    <a href="{% url 'register' %}">Sign up</a>
</p>

<br><br>

<!-- ============================ COMPONENT LOGIN  END.// ================================= -->

</section>

<!-- ========================= SECTION CONTENT END// ========================= -->

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('reset-password-form');
    if (!form) return;

    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const message = document.getElementById('message');
    const button = form.querySelector('[type="submit"]');

    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const token = params.get('token');

    if (!uid || !token) {
        message.textContent = 'Invalid or incomplete password reset link.';
        message.className = 'text-center mt-3 text-danger';
        if (button) button.disabled = true;
        return;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const password = passwordInput.value;
        const confirm_password = confirmInput.value;

        if (password !== confirm_password) {
            message.textContent = 'Passwords do not match.';
            message.className = 'text-center mt-3 text-danger';
            return;
        }

        if (!window.API) {
            message.textContent = 'API helper not found. Please refresh the page.';
            message.className = 'text-center mt-3 text-danger';
            return;
        }

        if (button) {
            button.disabled = true;
            button.textContent = 'Resetting...';
        }

        message.textContent = '';

       
    try {
        const response = await window.API.request(
            '/accounts/api/reset-password/',
            {
                method: 'POST',
                body: JSON.stringify({
                    uid: uid,
                    token: token,
                    password: password,
                    confirm_password: confirm_password
                })
            }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            const passwordErrors = Array.isArray(data.password)
                ? data.password.join(' ')
                : '';

            throw new Error(
                data.message ||
                data.detail ||
                passwordErrors ||
                'Unable to reset password. Please try again.'
            );
        }

        message.textContent =
            data.message || 'Password reset successful.';
        message.className = 'text-center mt-3 text-success';
        message.style.display = 'block';

        form.reset();

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        setTimeout(function () {
            window.location.href = "{% url 'login' %}";
        }, 2000);

    } catch (error) {
        console.error('Reset password error:', error);

        message.textContent =
            error.message || 'Something went wrong. Please try again.';
        message.className = 'text-center mt-3 text-danger';
        message.style.display = 'block';

    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = 'Reset Password';
        }
    }

    });
});
</script>


{% endblock %}
